name: KIAssistent
options:
  bundleIdPrefix: at.43856
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  KIAssistent:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: KI-Assistent
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/KIAssistent.entitlements
      properties:
        com.apple.security.application-groups:
          - group.at.43856.kiassistent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.43856.kiassistent
    dependencies:
      - target: BroadcastExtension
        embed: true

  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - BroadcastExtension
      - Shared
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: KI-Assistent
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: BroadcastExtension/BroadcastExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.at.43856.kiassistent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.43856.kiassistent.BroadcastExtension
        APPLICATION_EXTENSION_API_ONLY: YES
